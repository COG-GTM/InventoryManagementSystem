services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://localhost:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/parts >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build: ./web
    ports:
      - "8081:4173"
    environment:
      - API_PROXY_TARGET=http://server:3001
    depends_on:
      server:
        condition: service_healthy
