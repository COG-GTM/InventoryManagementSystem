name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore solution
        run: dotnet restore FelixBerinde-InventoryManagementSystem/FelixBerinde-InventoryManagementSystem.sln
      - name: Build solution
        run: dotnet build FelixBerinde-InventoryManagementSystem/FelixBerinde-InventoryManagementSystem.sln --configuration Release --no-restore -warnaserror
      - name: Run tests
        run: dotnet test FelixBerinde-InventoryManagementSystem/FelixBerinde-InventoryManagementSystem.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
