name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build FelixBerinde-InventoryManagementSystem/FelixBerinde-InventoryManagementSystem.sln --configuration Release
      - name: Run tests
        run: dotnet test FelixBerinde-InventoryManagementSystem/FelixBerinde-InventoryManagementSystem.sln --configuration Release --no-build
